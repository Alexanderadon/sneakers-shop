<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" fill="none">
  <defs>
    <linearGradient id="bodyG" x1="40" y1="60" x2="380" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eaff"/>
    </linearGradient>
    <linearGradient id="soleG" x1="0" y1="190" x2="420" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f1f2e"/>
      <stop offset="1" stop-color="#3a3a55"/>
    </linearGradient>
    <linearGradient id="swooshG" x1="120" y1="150" x2="360" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00B5FF"/>
    </linearGradient>
    <linearGradient id="ankleG" x1="50" y1="80" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f1ff"/>
      <stop offset="1" stop-color="#d9d3ff"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="220" cy="225" rx="180" ry="8" fill="#1f1f2e" opacity=".08"/>

  <!-- midsole (white) -->
  <path d="M30 195
           Q30 178 50 175
           L370 175
           Q392 175 392 195
           Q392 210 370 212
           L55 212
           Q30 212 30 195 Z"
        fill="#ffffff" stroke="#e6e6f2" stroke-width="1.5"/>

  <!-- outsole (dark) -->
  <path d="M35 205
           L385 205
           Q392 205 392 210
           Q392 218 380 218
           L50 218
           Q35 218 35 210 Z"
        fill="url(#soleG)"/>

  <!-- main upper body: heel -> ankle collar -> tongue -> toe -->
  <path d="M55 175
           Q55 130 100 115
           Q120 108 130 100
           Q135 95 145 92
           Q160 88 170 95
           Q176 100 180 110
           L185 130
           Q190 145 210 150
           L320 155
           Q350 156 365 170
           Q372 175 372 175
           L55 175 Z"
        fill="url(#bodyG)" stroke="#d8d4ff" stroke-width="1.8"/>

  <!-- ankle collar (cushioned) -->
  <path d="M55 175
           Q55 130 100 115
           Q108 113 115 112
           Q108 130 105 150
           Q102 165 95 175 Z"
        fill="url(#ankleG)" stroke="#d8d4ff" stroke-width="1.5"/>

  <!-- tongue -->
  <path d="M115 112
           Q120 95 132 90
           Q142 86 152 92
           Q150 110 145 130
           Q142 138 132 140
           Q120 140 115 130 Z"
        fill="#f7f6ff" stroke="#d8d4ff" stroke-width="1.5"/>

  <!-- laces -->
  <g stroke="#9aa0b4" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M122 118 L172 128"/>
    <path d="M120 130 L172 140"/>
    <path d="M118 142 L170 152"/>
  </g>
  <g fill="#9aa0b4">
    <circle cx="122" cy="118" r="2"/>
    <circle cx="172" cy="128" r="2"/>
    <circle cx="120" cy="130" r="2"/>
    <circle cx="172" cy="140" r="2"/>
    <circle cx="118" cy="142" r="2"/>
    <circle cx="170" cy="152" r="2"/>
  </g>

  <!-- swoosh / brand stripe -->
  <path d="M190 168
           Q230 130 320 142
           Q335 144 345 152
           Q335 150 320 152
           Q255 158 200 175 Z"
        fill="url(#swooshG)"/>

  <!-- toe stitching -->
  <path d="M310 172 Q330 162 355 168" stroke="#d8d4ff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M260 172 Q280 167 295 172" stroke="#d8d4ff" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- heel logo dot -->
  <circle cx="78" cy="155" r="5" fill="#FFD166"/>

  <!-- highlight -->
  <path d="M150 100 Q180 100 200 115" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8"/>
</svg>
